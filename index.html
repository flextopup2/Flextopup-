<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlexTopUp</title>
<style>
body{margin:0;font-family:Arial;background:#e9edf2;display:flex;justify-content:center}
.phone{width:100%;max-width:420px;background:#f6f7fb;min-height:100vh;padding:14px}
.header{background:#0b4db3;color:#fff;padding:16px;border-radius:14px;text-align:center}
.card{background:#fff;border-radius:14px;padding:16px;margin-top:14px}
input{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #ddd;font-size:16px;box-sizing:border-box}
button{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:8px}
.btn-blue{background:#0b5cff;color:#fff}
.btn-green{background:#00a651;color:#fff}
.btn-yellow{background:#ffd500;color:#000}
.tab{display:flex;gap:8px}
.tab button{flex:1;background:#eee}
.tab button.active{background:#0b4db3;color:#fff}
.plan{background:#fff;border-radius:12px;padding:12px;margin-top:10px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="phone">
<div class="header"><h2 style="margin:0">⚡ FlexTopUp</h2><small>Buy Data Cheap & Fast</small></div>

<!-- LOGIN / REGISTER -->
<div id="authPage" class="card">
<h3 style="text-align:center;margin:0">Welcome 👋</h3>
<div class="tab">
<button id="tabLogin" class="active">LOGIN</button>
<button id="tabRegister">REGISTER</button>
</div>

<div id="loginForm">
<input id="loginPhone" placeholder="Phone e.g 07078269788" type="tel">
<input id="loginPass" type="password" placeholder="Password">
<button class="btn-blue" id="loginBtn">LOGIN TO MY ACCOUNT</button>
</div>

<div id="registerForm" style="display:none">
<input id="regName" placeholder="Your Full Name">
<input id="regPhone" placeholder="Phone e.g 07078269788" type="tel">
<input id="regPass" type="password" placeholder="Create Password">
<button class="btn-green" id="registerBtn">CREATE MY ACCOUNT</button>
</div>

<p style="text-align:center;font-size:13px">WhatsApp: 07078269788<br>Email: flextopup2@gmail.com</p>
</div>

<!-- HOME -->
<div id="homePage" class="card" style="display:none">
<h3>Hi, <span id="userName"></span> 👋</h3>
<p>Phone: <span id="userPhone"></span></p>
<p><b>Wallet: ₦<span id="walletBal">0</span></b></p>
<h3>Buy Data 📶</h3>
<div class="plan"><div><b>MTN 1GB</b><br><small>Valid 2 days</small></div><div><b>₦400</b><br><button class="btn-green" style="padding:8px 14px;width:auto" id="buyBtn">Buy</button></div></div>
<div class="plan"><div><b>GLO 1GB</b><br><small>Valid 2 days</small></div><div><b>₦350</b><br><button class="btn-green" style="padding:8px 14px;width:auto" id="buyBtn2">Buy</button></div></div>
<button class="btn-yellow" id="logoutBtn">Logout</button>
</div>

</div>
<script>
// FRESH START - SIMPLE, NO SPLASH, NO AUTO LOGOUT
var users = [];
var currentUser = null;

try { users = JSON.parse(localStorage.getItem('ft_users') || '[]'); } catch(e){ users = []; }
try { currentUser = JSON.parse(localStorage.getItem('ft_current') || 'null'); } catch(e){ currentUser = null; }

function showAuth(){
  document.getElementById('authPage').style.display = 'block';
  document.getElementById('homePage').style.display = 'none';
}
function showHome(){
  document.getElementById('authPage').style.display = 'none';
  document.getElementById('homePage').style.display = 'block';
  document.getElementById('userName').innerText = currentUser.name;
  document.getElementById('userPhone').innerText = currentUser.phone;
}

document.getElementById('tabLogin').addEventListener('click', function(){
  document.getElementById('loginForm').style.display = 'block';
  document.getElementById('registerForm').style.display = 'none';
  document.getElementById('tabLogin').classList.add('active');
  document.getElementById('tabRegister').classList.remove('active');
});

document.getElementById('tabRegister').addEventListener('click', function(){
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('registerForm').style.display = 'block';
  document.getElementById('tabLogin').classList.remove('active');
  document.getElementById('tabRegister').classList.add('active');
});

document.getElementById('registerBtn').addEventListener('click', function(){
  var name = document.getElementById('regName').value.trim();
  var phone = document.getElementById('regPhone').value.trim();
  var pass = document.getElementById('regPass').value.trim();
  if(!name || !phone || !pass){ alert('Enter Name, Phone and Password'); return; }
  currentUser = {name:name, phone:phone, pass:pass};
  users.push(currentUser);
  localStorage.setItem('ft_users', JSON.stringify(users));
  localStorage.setItem('ft_current', JSON.stringify(currentUser));
  alert('Account created! Welcome ' + name);
  showHome();
});

document.getElementById('loginBtn').addEventListener('click', function(){
  var phone = document.getElementById('loginPhone').value.trim();
  var pass = document.getElementById('loginPass').value.trim();
  if(!phone || !pass){ alert('Enter Phone and Password'); return; }
  var found = null;
  for(var i=0;i<users.length;i++){ if(users[i].phone === phone) found = users[i]; }
  if(!found){ alert('No account for this phone. Press REGISTER first.'); return; }
  if(found.pass !== pass){ alert('Wrong password!'); return; }
  currentUser = found;
  localStorage.setItem('ft_current', JSON.stringify(currentUser));
  alert('Welcome back ' + found.name);
  showHome();
});

document.getElementById('logoutBtn').addEventListener('click', function(){
  localStorage.removeItem('ft_current');
  currentUser = null;
  showAuth();
});

document.getElementById('buyBtn').addEventListener('click', function(){ alert('MTN 1GB - You go fund wallet first for next step'); });
document.getElementById('buyBtn2').addEventListener('click', function(){ alert('GLO 1GB - You go fund wallet first for next step'); });

if(currentUser){ showHome(); } else { showAuth(); }
</script>
</body>
</html>
